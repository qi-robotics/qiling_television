mujoco_simulator:
    # MuJoCo 场景文件。使用 ROS package URI，避免依赖旧的
    # robot_description/S4/mjcf 目录结构。
    modelPath: "package://qi_robot_description/new_scene/scene_S4_40DOF_fullbody.xml"

    # 仅用于日志显示，不再用于拼接模型路径。
    modelName: "scene_S4_40DOF_fullbody"
 
    # 电机状态与命令topic
    lowStateTopic: "/human_lower_state" 
    jointCommandsTopic: "/human_lower_command" 
    qposTopic: "/mujoco/qpos"

    # 加载模型后是否暂停
    unPauseService: "/unpause_mujoco" # 启动服务名称
    initPauseFlag: true # 1是会暂停,0是不会暂停

    # 是否输出模型信息表格
    modelTableFlag: true # 1是会,0是不会

    # 第一阶段遥操仿真：固定 base_link，冻结 12 个腿关节。
    # 模型仍保留原始 40 个 actuator，因此 /human_lower_command 接口不变；
    # 腿部对应的前 12 个命令会在仿真端忽略。
    fixedBase: true
    freezeLegs: true

    # 启动后从安全起始姿态平滑过渡到目标 home，避免双臂直接张开。
    startupKeyframe: "teleop_start"
    targetKeyframe: "teleop_home"
    homeTransitionEnabled: true
    homeTransitionKeyframes:
      - "teleop_start"
      - "teleop_elbow_lift"
      - "teleop_shoulder_rear"
      - "teleop_home"
    homeTransitionDurations: [0.8, 1.0, 1.2]
    # Conservative high-level gains for the small-inertia O6 hinges.
    # The MuJoCo motors already provide the inner torque actuation.
    homeTransitionKp: 35.0
    homeTransitionKd: 4.0
    homeHoldKp: 30.0
    homeHoldKd: 4.0
